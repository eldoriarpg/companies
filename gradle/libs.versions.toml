[versions]
jackson = "3.2.4"
eldoutil = "3.5.0"
sadu = "2.3.1"
paper = "1.21.11-R0.1-SNAPSHOT"
junit = "5.11.4"

[libraries]
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }

messageblocker = "de.eldoria:messageblocker:1.1.3"
jackson-configuration = { module = "de.eldoria.util:jackson-configuration", version.ref = "eldoutil" }
plugin = { module = "de.eldoria.util:plugin", version.ref = "eldoutil" }
threading = { module = "de.eldoria.util:threading", version.ref = "eldoutil" }
updater = { module = "de.eldoria.util:updater", version.ref = "eldoutil" }
ocular = "dev.chojo:ocular:2.3.1"

protocollib = "com.comphenix.protocol:ProtocolLib:5.3.0"
papi = "me.clip:placeholderapi:2.11.6"
vault = "com.github.MilkBowl:VaultAPI:1.7.1"

hikari = "com.zaxxer:HikariCP:6.2.1"
mariadb = "org.mariadb.jdbc:mariadb-java-client:3.5.3"
sqlite = "org.xerial:sqlite-jdbc:3.49.1.0"
postgres = "org.postgresql:postgresql:42.7.5"

sadu-queries = { module = "de.chojo.sadu:sadu-queries", version.ref = "sadu" }
sadu-updater = { module = "de.chojo.sadu:sadu-updater", version.ref = "sadu" }
sadu-datasource = { module = "de.chojo.sadu:sadu-datasource", version.ref = "sadu" }
sadu-postgresql = { module = "de.chojo.sadu:sadu-postgresql", version.ref = "sadu" }
sadu-mariadb = { module = "de.chojo.sadu:sadu-mariadb", version.ref = "sadu" }
sadu-sqlite = { module = "de.chojo.sadu:sadu-sqlite", version.ref = "sadu" }

jetbrains-annotations = "org.jetbrains:annotations:26.0.2"
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

gradle-spotless = "com.diffplug.spotless:spotless-plugin-gradle:8.10.4"
gradle-publishdata = "de.chojo:publishdata:2.1.0"

[bundles]
jackson = ["jackson-databind", "jackson-annotations", "jackson-yaml"]
eldoria-utilities = ["jackson-configuration", "plugin", "threading", "updater", "ocular"]
database = ["hikari", "mariadb", "sqlite", "postgres"]
sadu = ["sadu-queries", "sadu-updater", "sadu-datasource", "sadu-postgresql", "sadu-mariadb", "sadu-sqlite"]

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
pluginyml-bukkit = { id = "de.eldoria.plugin-yml.bukkit", version = "0.9.0" }
runserver = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
