[versions]
palantir = "2.84.0"
jackson = "3.2.4"
eldoutil = "3.7.0"
sadu = "2.4.0"
paper = "1.21.11-R0.1-SNAPSHOT"
junit = "6.1.3"
strokkcommands = "2.3.1"
testcontainers = "2.0.5"
javalin = "7.2.4"
logback = "1.6.6"

[libraries]
strokkcommands-annotations = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokkcommands" }
strokkcommands-processor = { module = "net.strokkur.commands:processor-paper", version.ref = "strokkcommands" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }

messageblocker = "de.eldoria:messageblocker:2.1.0"
jackson-configuration = { module = "de.eldoria.util:jackson-configuration", version.ref = "eldoutil" }
ocular = { module = "dev.chojo:ocular", version = "2.4.1" }
plugin = { module = "de.eldoria.util:plugin", version.ref = "eldoutil" }
threading = { module = "de.eldoria.util:threading", version.ref = "eldoutil" }
updater = { module = "de.eldoria.util:updater", version.ref = "eldoutil" }

papi = "me.clip:placeholderapi:2.12.3"
vault = "com.github.MilkBowl:VaultAPI:1.7.1"
citizens = "net.citizensnpcs:citizens-main:2.0.44-SNAPSHOT"
fancynpcs = "de.oliver:FancyNpcs:2.11.0"
worldguard = "com.sk89q.worldguard:worldguard-bukkit:7.0.20"
worldedit = "com.sk89q.worldedit:worldedit-bukkit:7.4.6"
plotsquared = "com.intellectualsites.plotsquared:plotsquared-core:7.6.0"

hikari = "com.zaxxer:HikariCP:7.1.0"
mariadb = "org.mariadb.jdbc:mariadb-java-client:3.5.11"
sqlite = "org.xerial:sqlite-jdbc:3.54.1.0"
postgres = "org.postgresql:postgresql:42.7.14"
jedis = "redis.clients:jedis:8.0.2"
log4j-core = "org.apache.logging.log4j:log4j-core:2.26.1"

sadu-queries = { module = "de.chojo.sadu:sadu-queries", version.ref = "sadu" }
sadu-updater = { module = "de.chojo.sadu:sadu-updater", version.ref = "sadu" }
sadu-datasource = { module = "de.chojo.sadu:sadu-datasource", version.ref = "sadu" }
sadu-postgresql = { module = "de.chojo.sadu:sadu-postgresql", version.ref = "sadu" }
sadu-mariadb = { module = "de.chojo.sadu:sadu-mariadb", version.ref = "sadu" }
sadu-sqlite = { module = "de.chojo.sadu:sadu-sqlite", version.ref = "sadu" }
sadu-mapper = { module = "de.chojo.sadu:sadu-mapper", version.ref = "sadu" }

javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
jspecify = "org.jspecify:jspecify:1.0.1"
spotbugs-annotations = "com.github.spotbugs:spotbugs-annotations:4.10.5"
json-schema-validator = "com.networknt:json-schema-validator:3.0.8"
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

mockbukkit = "org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }

gradle-spotless = "com.diffplug.spotless:spotless-plugin-gradle:8.10.4"
gradle-publishdata = "de.chojo:publishdata:2.3.0"
gradle-spotbugs = "com.github.spotbugs:com.github.spotbugs.gradle.plugin:6.5.13"

[bundles]
jackson = ["jackson-databind", "jackson-annotations", "jackson-yaml"]
eldoria-utilities = ["jackson-configuration", "plugin", "threading", "updater"]
database = ["hikari", "mariadb", "sqlite", "postgres"]
sadu-postgresql = ["sadu-queries", "sadu-updater", "sadu-datasource", "sadu-postgresql", "sadu-mapper"]
sadu = ["sadu-queries", "sadu-updater", "sadu-datasource", "sadu-postgresql", "sadu-mariadb", "sadu-sqlite"]

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
pluginyml-bukkit = { id = "de.eldoria.plugin-yml.bukkit", version = "0.9.0" }
runserver = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
