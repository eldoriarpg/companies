database:
  host: mariadb
  port: 3306
  database: companies
  user: demo
  password: ${CFG_DB_PASSWORD}
seed:
  enabled: true
  companies:
    - name: Stonebridge
      owner: Demo_Ada
      members: [Demo_Ben, Demo_Cleo]
    - name: Greenfield Farms
      owner: Demo_Dora
      members: [Demo_Emil]
    - name: Copperworks
      owner: Demo_Finn
      members: [Demo_Gina, Demo_Hugo]
  orders:
    - owner: Demo_Ivy
      name: Stone for the town wall
      lines:
        - {material: STONE, amount: 256, price: 0.4}
        - {material: STONE_BRICKS, amount: 64, price: 0.8}
    - owner: Demo_Jon
      name: Timber
      lines:
        - {material: OAK_LOG, amount: 128, price: 0.6}
    - owner: Demo_Kai
      name: Bakery supplies
      lines:
        - {material: WHEAT, amount: 192, price: 0.3}
        - {material: SUGAR_CANE, amount: 64, price: 0.4}
    - owner: Demo_Lena
      name: Workshop iron
      lines:
        - {material: IRON_INGOT, amount: 64, price: 3.0}
        - {material: COAL, amount: 128, price: 0.5}
    - owner: Demo_Mats
      name: Windows
      lines:
        - {material: GLASS, amount: 96, price: 0.7}
    - owner: Demo_Nora
      name: Lights for the market
      lines:
        - {material: TORCH, amount: 128, price: 0.2}
        - {material: LANTERN, amount: 16, price: 4.0}
  market:
    days: 30
    prices:
      STONE: 0.4
      STONE_BRICKS: 0.8
      COBBLESTONE: 0.3
      OAK_LOG: 0.6
      SPRUCE_PLANKS: 0.4
      WHEAT: 0.3
      SUGAR_CANE: 0.4
      BREAD: 1.2
      IRON_INGOT: 3.0
      COAL: 0.5
      GLASS: 0.7
      TORCH: 0.2
      LANTERN: 4.0
      WHITE_WOOL: 0.9
      DIAMOND: 25.0
sandbox:
  minutes: 30
  pauseMinutes: 0
commands:
  enabled: true
  allowed: [demo, company, comp, order, companyadmin, plot, plots, p, balance, bal, money, pay, baltop, balancetop,
            help, list, msg, tell, r]
messages:
  usage: '<gray>/demo admin</gray> takes the admin sandbox for a while, <gray>/demo admin off</gray> ends it.'
  players: 'Only players use /demo.'
  permission: '<red>You may not use the admin sandbox.'
  failed: '<red>That did not work, try again in a moment.'
  refused: '<red>That command is not part of the demo. Try <gray>/company</gray>, <gray>/order</gray> or <gray>/demo</gray>.'
  admin:
    enabled: '<green>You are a demo admin for <minutes> minutes. Try <gray>/companyadmin</gray> and the Admin tab of the dashboard (log in again); the nightly reset undoes everything.'
    active: '<yellow>You are a demo admin already.'
    wait: '<yellow>You were a demo admin lately. Try again later.'
    disabled: '<green>You are no demo admin anymore.'
    none: '<yellow>You are no demo admin.'
groups:
  default:
    - essentials.msg
    - essentials.reply
    - essentials.list
    - essentials.help
  demo-admin:
    - companies.admin
    - companies.admin.calcLevel
    - companies.admin.events
    - companies.admin.offers
    - companies.admin.orders
    - companies.admin.player
    - companies.admin.jobs
    - -companies.admin.delete
    - -companies.admin.reload
    - -companies.admin.transferOwner
    - -companies.admin.nodes
    - -companies.admin.dashboard
    - -companies.admin.debug
    - -companies.admin.grant
    - -companies.admin.level
    - -companies.admin.rename
    - -companies.admin.treasury
    - -companies.admin.areas
    - -companies.admin.areas.bypass
    - -companies.admin.jobs.bypass
    - -companies.admin.boards
