seed:
  enabled: false
sandbox:
  minutes: 30
  pauseMinutes: 0
commands:
  enabled: true
  allowed: [demo, company, comp, order, companyadmin, plot, plots, p, balance, bal, money, pay, baltop, balancetop,
            help, list, msg, tell, r, claim, trust, untrust, trustlist, abandonclaim, claimslist, trapped]
reset:
  cooldownMinutes: 10
pay:
  maxAmount: 1000
  commands: [pay, xconomy:pay]
messages:
  pay: '<red>Visitors pay at most <max> at once.'
  usage: '<gray>/demo guide</gray> gives the guide, <gray>/demo admin</gray> takes the admin sandbox, <gray>/demo admin off</gray> ends it, <gray>/demo reset-me</gray> removes your company and open orders.'
  players: 'Only players use /demo.'
  permission: '<red>You may not use the admin sandbox.'
  failed: '<red>That did not work, try again in a moment.'
  refused: '<red>That command is not part of the demo. Try <gray>/company</gray>, <gray>/order</gray> or <gray>/demo</gray>.'
  admin:
    enabled: '<green>You are a demo admin for <minutes> minutes. Try <gray>/companyadmin</gray> and the Admin tab of the dashboard (log in again); the nightly reset undoes everything.'
    active: '<yellow>You are a demo admin already.'
    wait: '<yellow>You were a demo admin lately. Try again later.'
    disabled: '<green>You are no demo admin anymore.'
    none: '<yellow>You are no demo admin.'
  reset:
    ask: '<yellow><gray>/demo reset-me</gray> removes what is yours:'
    company: '<gray>- your company <white><company></white> (members: <members>)'
    orders: '<gray>- your <orders> open orders, their price paid back'
    confirm: '<yellow>Run <gray>/demo reset-me</gray> again within <seconds> seconds to confirm.'
    nothing: '<yellow>You own no company and have no open orders.'
    done: '<green>Your reset is done.'
    disbanded: '<gray>Disbanded <white><company></white>.'
    notDisbanded: '<red>Could not disband <company>; try again in a moment.'
    cancelled: '<gray>Cancelled <orders> open orders.'
    taken: '<gray><orders> orders stay: a company or worker has taken them.'
    member: '<gray>You stay a member of <white><company></white>; only its owner disbands it.'
    wait: '<yellow>You reset lately. Try again in <minutes> minutes.'
guide:
  title: '<gold>Companies demo'
  author: Companies
  onFirstJoin: false
  pages:
    - "<bold>Companies demo</bold>\n\nFound a company, take orders, deliver items and get paid.\n\nEverything resets every night."
    - "<bold>Your company</bold>\n\n<dark_gray>/company create \\<name></dark_gray>\nfounds one.\n\n<dark_gray>/company join \\<name></dark_gray>\njoins Stonebridge, Copperworks or Greenfield Farms."
    - "<bold>Orders</bold>\n\n<dark_gray>/company order search</dark_gray>\nfinds orders to take with your company.\n\n<dark_gray>/order create \\<name></dark_gray>\nplaces your own."
    - "<bold>The market</bold>\n\nPrices of the last weeks are on the dashboard.\n\nServer orders appear every few hours."
    - "<bold>Dashboard</bold>\n\n<dark_gray>/company dashboard</dark_gray>\ngives a link and a code. Open it on phone or PC."
    - "<bold>Two servers</bold>\n\n<dark_gray>/server hub</dark_gray> is the spawn, <dark_gray>/server lands</dark_gray> has plots and claims.\n\nCompanies and orders are shared."
    - "<bold>Admin tools</bold>\n\n<dark_gray>/demo admin</dark_gray>\nmakes you a demo admin for 30 minutes.\n\n<dark_gray>/demo guide</dark_gray>\ngives this book again."
    - "<bold>Start over</bold>\n\n<dark_gray>/demo reset-me</dark_gray>\nremoves your company and your open orders, once you confirm it."
