name: Pull Request Meta Information

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  label:
    name: Label the pull request
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Label the pull request by branch and changed files
        uses: actions/labeler@v7
        with:
          sync-labels: true
