name: Verify

on:
  push:
    branches: [main, 'renovate/**']
    tags: ['v*']
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 25

jobs:
  verify-format:
    runs-on: ubuntu-latest
    name: Verify Formatting
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting and license headers
        run: ./gradlew spotlessCheck

  verify-nulls:
    runs-on: ubuntu-latest
    name: Verify Null Use
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check null use
        run: ./gradlew spotbugsMain
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-reports
          path: '*/build/reports/spotbugs/'

  verify-tests:
    runs-on: ubuntu-latest
    name: Verify Tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the tests
        run: ./gradlew test
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  verify-build:
    runs-on: ubuntu-latest
    name: Verify Build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build the plugin
        run: ./gradlew assemble
      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: companies-paper/build/libs/companies-paper-*-all.jar
