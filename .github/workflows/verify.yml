name: Verify

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 25

jobs:
  verify-format:
    runs-on: ubuntu-latest
    name: Verify Formatting
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting and license headers
        run: ./gradlew spotlessCheck

  verify-nulls:
    runs-on: ubuntu-latest
    name: Verify Null Use
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check null use
        run: ./gradlew spotbugsMain
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-reports
          path: '*/build/reports/spotbugs/'

  verify-tests:
    runs-on: ubuntu-latest
    name: Verify Tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the tests
        run: ./gradlew test
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  verify-build:
    runs-on: ubuntu-latest
    name: Verify Build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build the plugin
        run: ./gradlew assemble
      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: companies-paper/build/libs/companies-paper-*-all.jar

  verify-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run the tests
        run: npx vitest run
      - name: Lint, type check and build
        run: node scripts/build.mjs
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the end-to-end stories against the build and a mock gateway
        run: npx playwright test
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: web/frontend/e2e/report

  build:
    runs-on: ubuntu-latest
    name: build
    if: always()
    needs: [verify-format, verify-nulls, verify-tests, verify-build, verify-frontend]
    steps:
      - name: Require every verification to pass
        run: |
          for result in "${{ needs.verify-format.result }}" "${{ needs.verify-nulls.result }}" \
                        "${{ needs.verify-tests.result }}" "${{ needs.verify-build.result }}" \
                        "${{ needs.verify-frontend.result }}"; do
            [ "$result" = "success" ] || exit 1
          done
