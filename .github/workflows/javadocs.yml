name: Javadocs

on:
  push:
    branches: [main]
    paths: ['companies-api/**', '.github/workflows/javadocs.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: javadocs
  cancel-in-progress: false

env:
  JAVA_VERSION: 25

jobs:
  javadocs:
    runs-on: ubuntu-latest
    name: Publish the API javadoc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build the javadoc
        run: |
          ./gradlew :companies-api:javadoc
          touch companies-api/build/docs/javadoc/.nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: companies-api/build/docs/javadoc
